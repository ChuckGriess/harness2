# Egress allowlist for the AI Radar sandbox: HTTPS CONNECT to listed hosts only, no caching.
http_port 3128
acl radar dstdomain "/etc/squid/allowlist.txt"
acl delivery dstdomain "/etc/squid/delivery.txt"
acl SSL_ports port 443
acl CONNECT method CONNECT
http_access deny CONNECT !SSL_ports
http_access allow radar
http_access allow delivery
http_access deny all
cache deny all
